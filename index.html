<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#123b4a"><title>Csónakos kaland</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#123b4a;font-family:system-ui;color:white;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}button{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;outline:none}button:focus{outline:none}canvas{display:block;width:100vw;height:100dvh}#hud{position:fixed;top:8px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:900;text-shadow:1px 2px 4px #123}#overlay,#rotate{position:fixed;inset:0;display:grid;place-items:center;background:#102d3bd9;text-align:center;padding:24px}#overlay article{max-width:420px}#rotate{display:none;z-index:9}button{border:0;border-radius:14px;background:#ffd25b;color:#223;padding:13px 22px;font-size:18px;font-weight:800}#pad{position:fixed;bottom:14px;left:20px;right:20px;display:flex;justify-content:space-between;pointer-events:none}#pad button{pointer-events:auto;background:#ffffff50;color:white;border:2px solid #ffffff70;font-size:28px;min-width:84px}@media(orientation:portrait) and (max-width:850px){#rotate{display:grid}}</style></head><body><canvas id="game"></canvas><div id="hud"><span>🌊 <b id="points">0</b> pont</span><span>❤️ <b id="health">3</b></span><span>🏆 <b id="best">0</b></span></div><div id="pad"><button id="up">▲</button><button id="down">▼</button></div><div id="overlay"><article><h1>🚤 Csónakos kaland</h1><p>Oldalnézetes motorcsónakverseny! Kerüld ki a bójákat, sziklákat és uszadékfákat. A vezető terepmintás ruhában, telefonnal a kezében szeli a hullámokat.</p><p>Fordítsd el a telefont. Irányítás: ▲ ▼</p><button id="start">Indulás!</button></article></div><div id="rotate"><div><h1>↻ Fordítsd el a telefont!</h1><p>Ez a játék fekvő képernyőre készült.</p></div></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let w,h,dpr,run=false,points=0,hp=3,record=+(localStorage.boatRecord||0),time=0,spawn=0,obstacles=[],immune=0,last=0;let y=200,move=0,damage=0,hitFlash=0;document.querySelector('#best').textContent=record;function size(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0);if(!run)y=h*.7}onresize=size;size();function ellipse(x,y,rx,ry,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill()}function path(coords,color,width){g.beginPath();coords.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.strokeStyle=color;g.lineWidth=width;g.stroke()}function background(){let grd=g.createLinearGradient(0,0,0,h);grd.addColorStop(0,'#8bbab6');grd.addColorStop(.55,'#d7cba6');grd.addColorStop(.56,'#367e8a');grd.addColorStop(1,'#165266');g.fillStyle=grd;g.fillRect(0,0,w,h);ellipse(w*.8,h*.15,27,27,'#ffe3a0');g.fillStyle='#73998b';g.beginPath();g.moveTo(0,h*.52);for(let x=0;x<=w+40;x+=40)g.lineTo(x,h*(.44+.035*Math.sin(x*.012)));g.lineTo(w,h*.57);g.lineTo(0,h*.57);g.fill();for(let i=0;i<35;i++){let x=((i*137-time*65)%(w+130)+w+130)%(w+130);let yy=h*(.58+(i*29%40)/100);path([[x,yy],[x+17+(i%5)*9,yy]],'#a3d3cf',1.5)}}function boat(){let s=Math.max(.72,Math.min(1.3,w/900));g.save();g.translate(w*.25,y);g.scale(s,s);if(immune>0&&Math.floor(time*12)%2)g.globalAlpha=.75;for(let i=0;i<5;i++)ellipse(-115-i*18,30+Math.sin(time*12+i)*4,8+i*2,2,'#c6e7e0');ellipse(0,30,115,8,'#b1dbd5');g.fillStyle='#e8dfc4';g.beginPath();g.moveTo(-112,0);g.lineTo(110,0);g.lineTo(85,37);g.quadraticCurveTo(0,51,-91,28);g.fill();path([[-108,3],[107,3]],'#6b4735',10);if(damage>0){g.fillStyle='#454b45';g.beginPath();g.moveTo(12,10);g.lineTo(23,17);g.lineTo(8,22);g.lineTo(16,29);g.lineTo(-1,33);g.lineTo(-12,23);g.lineTo(-23,25);g.lineTo(-18,14);g.closePath();g.fill();path([[15,11],[3,20],[12,26],[-4,32]],'#171d1b',3);if(damage>1){path([[-73,8],[-56,17],[-67,26],[-48,31]],'#222b2b',4);ellipse(-57,21,9,4,'#3a403b')}if(hitFlash>0){ellipse(0,13,115,38,'#ef725255')}}g.fillStyle='#30483e';g.fillRect(-25,-27,62,29);g.fillStyle='#b6d6d3';g.beginPath();g.moveTo(20,-37);g.lineTo(68,-37);g.lineTo(83,0);g.lineTo(20,0);g.fill();path([[20,-37],[68,-37],[83,0]],'#354b4a',4);g.fillStyle='#536443';g.fillRect(-32,-57,37,39);g.fillStyle='#253d2b';for(let i=0;i<8;i++)g.fillRect(-30+i*13%34,-54+i*17%32,9,6);ellipse(-16,-70,13,15,'#d5a17d');g.fillStyle='#46583e';g.fillRect(-30,-90,28,9);path([[-21,-42],[-58,-28]],'#d5a17d',8);g.fillStyle='#273e48';g.fillRect(-67,-43,13,22);path([[1,-42],[28,-23],[48,-23]],'#d5a17d',8);path([[48,-23],[58,-2]],'#273c36',4);g.fillStyle='#262b2a';g.fillRect(-96,17,15,29);g.restore()}function obstacle(o){let x=o.x,yy=o.y;ellipse(x,yy+14,36,6,'#a1c9c8');if(o.kind===0){g.fillStyle='#ee6944';g.beginPath();g.moveTo(x,yy-30);g.lineTo(x+17,yy+10);g.lineTo(x-17,yy+10);g.fill();g.fillStyle='white';g.fillRect(x-11,yy-2,22,7)}else if(o.kind===1){g.fillStyle='#81543b';g.fillRect(x-36,yy-8,72,19);g.fillStyle='#ad805a';g.fillRect(x-30,yy-5,59,5)}else{g.fillStyle='#777f7d';g.beginPath();g.moveTo(x-35,yy+10);g.lineTo(x-22,yy-22);g.lineTo(x+8,yy-31);g.lineTo(x+34,yy+8);g.fill();path([[x-22,yy-22],[x+2,yy-11],[x+8,yy-31]],'#a6b3ac',3)}}function hud(){document.querySelector('#points').textContent=Math.floor(points);document.querySelector('#health').textContent=hp;document.querySelector('#best').textContent=record}function start(){run=true;points=0;hp=3;spawn=0;obstacles=[];immune=0;damage=0;hitFlash=0;y=h*.7;document.querySelector('#overlay').style.display='none';hud()}document.querySelector('#start').onclick=start;function end(){run=false;record=Math.max(record,Math.floor(points));localStorage.boatRecord=record;hud();document.querySelector('#overlay article').innerHTML='<h1>Vége a játéknak!</h1><p>Pontszám: '+Math.floor(points)+'</p><button id="again">Új játék</button>';document.querySelector('#overlay').style.display='grid';document.querySelector('#again').onclick=start}function bind(id,dir){let el=document.getElementById(id);el.onpointerdown=e=>{e.preventDefault();el.blur();move=dir;el.setPointerCapture(e.pointerId)};el.onpointerup=el.onpointercancel=()=>move=0}bind('up',-1);bind('down',1);onkeydown=e=>{if(e.key==='ArrowUp'||e.key==='w')move=-1;if(e.key==='ArrowDown'||e.key==='s')move=1};onkeyup=()=>move=0;function frame(ms){let dt=Math.min((ms-last)/1000||0,.05);last=ms;time+=dt;background();if(run){y=Math.max(h*.58,Math.min(h*.89,y+move*240*dt));points+=dt*10;spawn-=dt;if(spawn<=0){obstacles.push({x:w+60,y:h*(.59+Math.random()*.28),kind:Math.floor(Math.random()*3),hit:false});spawn=Math.max(.55,1.4-points/1600)}for(const o of obstacles){o.x-=(230+Math.min(points*.5,180))*dt;if(!o.hit&&immune<=0&&Math.abs(o.x-w*.25)<73&&Math.abs(o.y-y)<32){o.hit=true;hp--;damage=Math.min(3,damage+1);hitFlash=.2;immune=1.5;if(hp<=0)end()}}obstacles=obstacles.filter(o=>o.x>-80);immune=Math.max(0,immune-dt);hitFlash=Math.max(0,hitFlash-dt);hud()}obstacles.forEach(obstacle);boat();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
